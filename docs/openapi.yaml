openapi: 3.0.3
info:
  title: Jagoz API
  version: 0.1.0
  description: API REST do projeto Jagoz para gestao de socios, atletas, patrocinadores, eventos, pagamentos e ficheiros.
servers:
  - url: http://localhost:8080
    description: Backend local
  - url: http://localhost:5173
    description: Frontend Vite local com proxy /api
tags:
  - name: Users
  - name: Members
  - name: Athletes
  - name: Teams
  - name: Sponsors
  - name: Sponsorships
  - name: Sponsorship catalog
  - name: Events
  - name: Payments
  - name: Files
  - name: Admin
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/users:
    post:
      tags: [Users]
      summary: Criar utilizador
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Utilizador criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Users]
      summary: Listar utilizadores
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size20"
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Pagina de utilizadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/users/login:
    post:
      tags: [Users]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Sessao criada
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/users/logout:
    post:
      tags: [Users]
      summary: Logout
      responses:
        "204":
          description: Sessao terminada
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/users/token:
    post:
      tags: [Users]
      summary: Criar token por username/password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateTokenInput"
      responses:
        "201":
          description: Token criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /api/users/me:
    get:
      tags: [Users]
      summary: Obter utilizador autenticado
      responses:
        "200":
          description: Utilizador autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
  /api/users/{userId}:
    get:
      tags: [Users]
      summary: Obter utilizador por id
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Utilizador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/users/{userId}/role:
    put:
      tags: [Users]
      summary: Atualizar role do utilizador
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Utilizador atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/users/{userId}/active-member:
    put:
      tags: [Users]
      summary: Atualizar socio ativo associado ao utilizador
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        "200":
          description: Utilizador atualizado
  /api/users/{userId}/associations:
    get:
      tags: [Users]
      summary: Obter associacoes de socio, atleta e patrocinador de um utilizador
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Associacoes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAssociations"
  /api/users/by-email:
    get:
      tags: [Users]
      summary: Procurar utilizador por email
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Utilizador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/users/by-username:
    get:
      tags: [Users]
      summary: Procurar utilizador por username
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Utilizador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/members:
    get:
      tags: [Members]
      summary: Listar socios
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size8"
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/MemberCategory"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MemberStatus"
      responses:
        "200":
          description: Pagina de socios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
  /api/members/active:
    get:
      tags: [Members]
      summary: Listar socios ativos
      security: []
      responses:
        "200":
          description: Lista de socios ativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /api/members/create:
    post:
      tags: [Members]
      summary: Criar socio
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCreateInput"
      responses:
        "200":
          description: Socio criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /api/members/{memberId}:
    get:
      tags: [Members]
      summary: Obter socio por id
      security: []
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Socio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    put:
      tags: [Members]
      summary: Atualizar socio
      security: []
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdateInput"
      responses:
        "200":
          description: Socio atualizado
    delete:
      tags: [Members]
      summary: Desativar socio
      security: []
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Socio desativado
  /api/members/{memberId}/approve:
    put:
      tags: [Members]
      summary: Aprovar socio
      security: []
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        $ref: "#/components/requestBodies/Approval"
      responses:
        "200":
          description: Socio aprovado
  /api/members/{memberId}/reject:
    put:
      tags: [Members]
      summary: Rejeitar socio
      security: []
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Socio rejeitado
  /api/members/{memberId}/reactivate:
    put:
      tags: [Members]
      summary: Reativar socio
      security: []
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reactivationDate]
              properties:
                reactivationDate:
                  type: string
                  format: date
      responses:
        "200":
          description: Socio reativado
  /api/members/{memberId}/category:
    put:
      tags: [Members]
      summary: Alterar categoria do socio
      security: []
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category:
                  $ref: "#/components/schemas/MemberCategory"
      responses:
        "200":
          description: Categoria alterada

  /api/teams/{teamCategoryId}/athletes:
    get:
      tags: [Athletes]
      summary: Listar atletas publicos de uma categoria
      security: []
      parameters:
        - name: teamCategoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Lista publica de atletas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AthletePublic"
  /api/athletes:
    post:
      tags: [Athletes]
      summary: Inscrever atleta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteCreationInput"
      responses:
        "201":
          description: Atleta criado
    get:
      tags: [Athletes]
      summary: Listar atletas para backoffice
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size8"
        - name: search
          in: query
          schema:
            type: string
        - name: teamCategory
          in: query
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AthleteStatus"
          style: form
          explode: true
      responses:
        "200":
          description: Pagina de atletas
  /api/athletes/me:
    get:
      tags: [Athletes]
      summary: Obter atleta associado ao utilizador autenticado
      responses:
        "200":
          description: Detalhe de atleta
  /api/athletes/{athleteId}:
    get:
      tags: [Athletes]
      summary: Detalhe publico do atleta
      security: []
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      responses:
        "200":
          description: Detalhe publico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthletePublic"
    delete:
      tags: [Athletes]
      summary: Desativar atleta
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      responses:
        "200":
          description: Atleta desativado
  /api/athletes/{athleteId}/edit:
    put:
      tags: [Athletes]
      summary: Atualizar atleta (dados pessoais + desportivos)
      description: >-
        Update administrativo. Grava os dados pessoais (Member) e do Athlete na
        mesma transacao. A mudanca de escalao usa o endpoint dedicado /team-category.
        Requer role SECRETARIA ou ADMIN.
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteUpdateInput"
      responses:
        "200":
          description: Atleta atualizado
  /api/athletes/{athleteId}/admin:
    get:
      tags: [Athletes]
      summary: Detalhe de atleta para backoffice
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      responses:
        "200":
          description: Detalhe administrativo
  /api/athletes/member/{memberId}:
    get:
      tags: [Athletes]
      summary: Obter atleta por socio
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Detalhe administrativo
  /api/athletes/{athleteId}/team-category:
    put:
      tags: [Athletes]
      summary: Alterar categoria/equipa do atleta
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamCategoryId]
              properties:
                teamCategoryId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Categoria alterada
  /api/athletes/{athleteId}/reactivate:
    put:
      tags: [Athletes]
      summary: Reativar atleta
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      responses:
        "200":
          description: Atleta reativado
  /api/athletes/{athleteId}/approve:
    put:
      tags: [Athletes]
      summary: Aprovar inscricao de atleta
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      requestBody:
        $ref: "#/components/requestBodies/Approval"
      responses:
        "200":
          description: Atleta aprovado
  /api/athletes/{athleteId}/reject:
    put:
      tags: [Athletes]
      summary: Rejeitar inscricao de atleta
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      responses:
        "200":
          description: Atleta rejeitado

  /api/teams/groups/active:
    get:
      tags: [Teams]
      summary: Listar grupos ativos
      security: []
      responses:
        "200":
          description: Grupos ativos
  /api/teams/groups:
    get:
      tags: [Teams]
      summary: Listar grupos
      security: []
      responses:
        "200":
          description: Grupos
    post:
      tags: [Teams]
      summary: Criar grupo
      requestBody:
        $ref: "#/components/requestBodies/TeamGroup"
      responses:
        "201":
          description: Grupo criado
  /api/teams/groups/{groupId}:
    put:
      tags: [Teams]
      summary: Atualizar grupo
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        $ref: "#/components/requestBodies/TeamGroup"
      responses:
        "200":
          description: Grupo atualizado
    delete:
      tags: [Teams]
      summary: Desativar grupo
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Grupo desativado
  /api/teams/groups/reorder:
    put:
      tags: [Teams]
      summary: Reordenar grupos
      requestBody:
        $ref: "#/components/requestBodies/Reorder"
      responses:
        "200":
          description: Grupos reordenados
  /api/teams/categories/active:
    get:
      tags: [Teams]
      summary: Listar categorias ativas
      security: []
      responses:
        "200":
          description: Categorias ativas
  /api/teams/categories:
    get:
      tags: [Teams]
      summary: Listar categorias
      security: []
      responses:
        "200":
          description: Categorias
    post:
      tags: [Teams]
      summary: Criar categoria
      requestBody:
        $ref: "#/components/requestBodies/TeamCategory"
      responses:
        "201":
          description: Categoria criada
  /api/teams/categories/{categoryId}:
    put:
      tags: [Teams]
      summary: Atualizar categoria
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        $ref: "#/components/requestBodies/TeamCategory"
      responses:
        "200":
          description: Categoria atualizada
    delete:
      tags: [Teams]
      summary: Desativar categoria
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Categoria desativada
  /api/teams/categories/reorder:
    put:
      tags: [Teams]
      summary: Reordenar categorias
      requestBody:
        $ref: "#/components/requestBodies/Reorder"
      responses:
        "200":
          description: Categorias reordenadas
  /api/teams/groups-prices:
    get:
      tags: [Teams]
      summary: Listar precos por grupo
      security: []
      responses:
        "200":
          description: Precos por grupo
    put:
      tags: [Teams]
      summary: Criar ou atualizar preco por grupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamGroupPriceRequest"
      responses:
        "200":
          description: Preco atualizado
  /api/teams/category-overrides:
    get:
      tags: [Teams]
      summary: Listar overrides de preco por categoria
      security: []
      responses:
        "200":
          description: Overrides de preco
    put:
      tags: [Teams]
      summary: Criar ou atualizar override de preco por categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCategoryPriceOverrideRequest"
      responses:
        "200":
          description: Override atualizado

  /api/sponsors:
    get:
      tags: [Sponsors]
      summary: Listar patrocinadores
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size20"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Pagina de patrocinadores
    post:
      tags: [Sponsors]
      summary: Criar patrocinador
      requestBody:
        $ref: "#/components/requestBodies/Sponsor"
      responses:
        "201":
          description: Patrocinador criado
  /api/sponsors/{sponsorId}:
    get:
      tags: [Sponsors]
      summary: Obter patrocinador
      parameters:
        - $ref: "#/components/parameters/SponsorId"
      responses:
        "200":
          description: Patrocinador
    put:
      tags: [Sponsors]
      summary: Atualizar patrocinador
      parameters:
        - $ref: "#/components/parameters/SponsorId"
      requestBody:
        $ref: "#/components/requestBodies/Sponsor"
      responses:
        "200":
          description: Patrocinador atualizado
  /api/sponsors/{sponsorId}/user:
    put:
      tags: [Sponsors]
      summary: Associar utilizador a patrocinador
      parameters:
        - $ref: "#/components/parameters/SponsorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Utilizador associado
  /api/sponsors/claim:
    post:
      tags: [Sponsors]
      summary: Reivindicar patrocinador existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorClaimRequest"
      responses:
        "200":
          description: Patrocinador reivindicado

  /api/sponsorships:
    get:
      tags: [Sponsorships]
      summary: Listar patrocinios
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size8"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SponsorshipStatus"
      responses:
        "200":
          description: Pagina de patrocinios
    post:
      tags: [Sponsorships]
      summary: Criar patrocinio
      requestBody:
        $ref: "#/components/requestBodies/Sponsorship"
      responses:
        "201":
          description: Patrocinio criado
  /api/sponsorships/with-sponsor:
    post:
      tags: [Sponsorships]
      summary: Criar patrocinador e patrocinio na mesma operacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sponsor, sponsorship]
              properties:
                sponsor:
                  $ref: "#/components/schemas/Sponsor"
                sponsorship:
                  $ref: "#/components/schemas/Sponsorship"
                userId:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        "201":
          description: Patrocinio criado
  /api/sponsorships/my:
    get:
      tags: [Sponsorships]
      summary: Listar patrocinios do utilizador autenticado
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size8"
      responses:
        "200":
          description: Pagina de patrocinios
  /api/sponsorships/{sponsorshipId}:
    get:
      tags: [Sponsorships]
      summary: Obter patrocinio
      parameters:
        - $ref: "#/components/parameters/SponsorshipId"
      responses:
        "200":
          description: Patrocinio
  /api/sponsors/{sponsorId}/sponsorships:
    get:
      tags: [Sponsorships]
      summary: Listar patrocinios de um patrocinador
      parameters:
        - $ref: "#/components/parameters/SponsorId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size8"
      responses:
        "200":
          description: Pagina de patrocinios
  /api/sponsorships/{sponsorshipId}/details:
    put:
      tags: [Sponsorships]
      summary: Atualizar detalhes de contacto/preco do patrocinio
      parameters:
        - $ref: "#/components/parameters/SponsorshipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipDetailUpdateRequest"
      responses:
        "200":
          description: Patrocinio atualizado
  /api/sponsorships/{sponsorshipId}/approve:
    put:
      tags: [Sponsorships]
      summary: Aprovar patrocinio
      parameters:
        - $ref: "#/components/parameters/SponsorshipId"
      responses:
        "200":
          description: Patrocinio aprovado
  /api/sponsorships/{sponsorshipId}/paid:
    put:
      tags: [Sponsorships]
      summary: Marcar patrocinio como pago
      parameters:
        - $ref: "#/components/parameters/SponsorshipId"
      responses:
        "200":
          description: Patrocinio pago
  /api/sponsorships/{sponsorshipId}/cancel:
    put:
      tags: [Sponsorships]
      summary: Cancelar patrocinio
      parameters:
        - $ref: "#/components/parameters/SponsorshipId"
      responses:
        "200":
          description: Patrocinio cancelado

  /api/sponsorship-catalog/pub-options/active:
    get:
      tags: [Sponsorship catalog]
      summary: Listar opcoes de publicidade ativas
      security: []
      responses:
        "200":
          description: Opcoes ativas
  /api/sponsorship-catalog/pub-options:
    post:
      tags: [Sponsorship catalog]
      summary: Criar opcao de publicidade
      requestBody:
        $ref: "#/components/requestBodies/PubOption"
      responses:
        "201":
          description: Opcao criada
  /api/sponsorship-catalog/pub-options/{pubOptionId}:
    put:
      tags: [Sponsorship catalog]
      summary: Atualizar opcao de publicidade
      parameters:
        - name: pubOptionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        $ref: "#/components/requestBodies/PubOption"
      responses:
        "200":
          description: Opcao atualizada
    delete:
      tags: [Sponsorship catalog]
      summary: Desativar opcao de publicidade
      parameters:
