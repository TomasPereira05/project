        "200":
          description: Estatisticas
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    Size8:
      name: size
      in: query
      schema:
        type: integer
        default: 8
        minimum: 1
    Size20:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AthleteId:
      name: athleteId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SponsorId:
      name: sponsorId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SponsorshipId:
      name: sponsorshipId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PlacementId:
      name: placementId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBodies:
    Approval:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [approvalDate]
            properties:
              approvalDate:
                type: string
                format: date
    Reorder:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                type: array
                items:
                  type: integer
                  format: int64
    TeamGroup:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TeamGroup"
    TeamCategory:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TeamCategory"
    Sponsor:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Sponsor"
    Sponsorship:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Sponsorship"
    PubOption:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PubOption"
    EquipmentPlacement:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EquipmentPlacement"
    OtherSport:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OtherSport"
    EventCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventCreateInput"
    EventUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventUpdateInput"
  responses:
    BadRequest:
      description: Pedido invalido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Nao autenticado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Sem permissao
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso nao encontrado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de estado ou recurso duplicado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Role:
      type: string
      enum: [ADMIN, SECRETARIA, NORMAL]
    MemberCategory:
      type: string
      enum: [SOCIO, ATLETA_SOCIO]
    MemberStatus:
      type: string
      enum: [PENDENTE, ATIVO, INATIVO, REJEITADO]
    AthleteStatus:
      type: string
      enum: [PENDENTE, ATIVO, INATIVO, REJEITADO]
    SponsorType:
      type: string
      enum: [PUB, TEAM, OTHER]
    SponsorshipStatus:
      type: string
      enum: [SUBMETIDO, APROVADO, PAGO, ATIVO, CANCELADO]
    FileOwnerType:
      type: string
      enum: [USER, MEMBER, ATHLETE]
    FileKind:
      type: string
      enum: [USER_PROFILE_PHOTO, MEMBER_PHOTO, ATHLETE_PHOTO, ATHLETE_ID_CARD, ATHLETE_MEDICAL_EXAM]
    GuardianRole:
      type: string
      enum: [FATHER, MOTHER, LEGAL_GUARDIAN]
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        status:
          type: integer
    Page:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
    CreateUserRequest:
      type: object
      required: [email, username, password, role]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          format: password
        role:
          $ref: "#/components/schemas/Role"
        activeMemberId:
          type: integer
          format: int64
          nullable: true
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email ou username.
        password:
          type: string
          format: password
    UserCreateTokenInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        username:
          type: string
        activeMemberId:
          type: integer
          format: int64
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
    AuthenticatedUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            token:
              type: string
    UserAssociations:
      type: object
      properties:
        member:
          type: object
          nullable: true
        athlete:
          type: object
          nullable: true
        sponsors:
          type: array
          items:
            $ref: "#/components/schemas/Sponsor"
    MemberCreateInput:
      type: object
      required: [completeName, birthDate, email, phone, address, postalCode, city, category, formerMember, privacyAccepted, comsAccepted]
      properties:
        linkedUsername:
          type: string
          nullable: true
        completeName:
          type: string
        birthDate:
          type: string
          format: date
        birthplace:
          type: string
          nullable: true
        email:
          type: string
          format: email
        phone:
          type: string
        homePhone:
          type: string
          nullable: true
        address:
          type: string
        postalCode:
          type: string
        city:
          type: string
        nif:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/MemberCategory"
        formerMember:
          type: boolean
        membershipQuota:
          type: integer
          nullable: true
        billingLocation:
          type: string
          nullable: true
        privacyAccepted:
          type: boolean
        comsAccepted:
          type: boolean
    MemberUpdateInput:
      allOf:
        - $ref: "#/components/schemas/MemberCreateInput"
    Member:
      allOf:
        - $ref: "#/components/schemas/MemberCreateInput"
        - type: object
          properties:
            memberId:
              type: integer
              format: int64
            memberNumber:
              type: integer
              nullable: true
            status:
              $ref: "#/components/schemas/MemberStatus"
            registrationDate:
              type: string
              format: date
            approvalDate:
              type: string
              format: date
              nullable: true
    GuardianInput:
      type: object
      required: [name, role, email, phone]
      properties:
        memberNumber:
          type: integer
          nullable: true
        name:
          type: string
        role:
          $ref: "#/components/schemas/GuardianRole"
        kinship:
          type: string
          nullable: true
        email:
          type: string
          format: email
        phone:
          type: string
        professionalActivity:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
    AthleteCreationInput:
      type: object
      properties:
        isSelfRegistration:
          type: boolean
        member:
          $ref: "#/components/schemas/MemberCreateInput"
        nationality:
          type: string
        niss:
          type: string
        numeroUtente:
          type: string
        bi:
          type: string
        biExpirationDate:
          type: string
          format: date
        school:
          type: string
          nullable: true
        schoolYear:
          type: string
          nullable: true
        schoolClass:
          type: string
          nullable: true
        lastClub:
          type: string
          nullable: true
        season:
          type: string
          nullable: true
        teamCategoryId:
          type: integer
          format: int64
          nullable: true
        jerseyNumber:
          type: integer
          nullable: true
        position:
          type: string
          nullable: true
        hasFamilyInClub:
          type: boolean
        schoolCertificationAccepted:
          type: boolean
        guardians:
          type: array
          items:
            $ref: "#/components/schemas/GuardianInput"
    AthleteUpdateInput:
      type: object
      description: >-
        Update administrativo do atleta. Inclui os dados pessoais que vivem no
        Member e os dados do Athlete — o backend grava ambos numa so transacao.
      properties:
        # Dados pessoais (Member)
        completeName:
          type: string
        birthDate:
          type: string
          format: date
        birthplace:
          type: string
          nullable: true
        email:
          type: string
        phone:
          type: string
        homePhone:
          type: string
          nullable: true
        address:
          type: string
        postalCode:
          type: string
        city:
          type: string
        nif:
          type: string
        # Dados pessoais (Athlete)
        nationality:
          type: string
        niss:
          type: string
        numeroUtente:
          type: string
        bi:
          type: string
        biExpirationDate:
          type: string
          format: date
        # Dados desportivos / escolares
        jerseyNumber:
          type: integer
          nullable: true
        position:
          type: string
          nullable: true
        school:
          type: string
          nullable: true
        schoolYear:
          type: string
          nullable: true
        schoolClass:
          type: string
          nullable: true
        lastClub:
          type: string
          nullable: true
        season:
          type: string
          nullable: true
        hasFamilyInClub:
          type: boolean
        guardians:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/GuardianInput"
      required:
        - completeName
        - birthDate
        - email
        - phone
        - address
        - postalCode
        - city
        - nif
        - nationality
        - niss
        - numeroUtente
        - bi
        - biExpirationDate
        - hasFamilyInClub
    AthletePublic:
      type: object
      properties:
        athleteId:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        completeName:
          type: string
        age:
          type: integer
        teamCategory:
          type: string
        season:
          type: string
        jerseyNumber:
          type: integer
          nullable: true
        position:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
    TeamGroup:
      type: object
      properties:
        teamGroupId:
          type: integer
          format: int64
          nullable: true
        code:
          type: string
        label:
          type: string
        active:
          type: boolean
        sortOrder:
          type: integer
          nullable: true
    TeamCategory:
      type: object
      properties:
        teamId:
          type: integer
          format: int64
          nullable: true
        teamGroupId:
          type: integer
          format: int64
        code:
          type: string
        label:
          type: string
        active:
          type: boolean
        sortOrder:
          type: integer
    TeamGroupPriceRequest:
      type: object
      required: [teamGroupId, placementId, price]
      properties:
        teamGroupId:
          type: integer
          format: int64
        placementId:
          type: integer
          format: int64
        price:
